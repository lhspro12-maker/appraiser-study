<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<link rel="manifest" href="manifest.json">
<title>감정평가사 1차 합격관리</title>
<style>
:root{--navy:#17365d;--green:#548235;--bg:#f4f6f8;--card:#fff;--muted:#667085;--danger:#b42318;--warn:#b54708}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:#17202a}
header{background:var(--navy);color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:3}
header h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;opacity:.85}
main{max-width:720px;margin:auto;padding:12px 12px 90px}.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{font-size:24px;font-weight:800}.label{font-size:12px;color:var(--muted)}
.progress{height:10px;background:#e6e9ee;border-radius:9px;overflow:hidden;margin-top:7px}.bar{height:100%;background:var(--green);width:0}
h2{font-size:17px;margin:2px 0 12px} label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
input,select,button,textarea{font:inherit} input,select,textarea{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:white}
button{border:0;border-radius:9px;padding:10px 12px;background:var(--navy);color:white;font-weight:700}.secondary{background:#667085}.danger{background:#b42318}
.row{display:grid;grid-template-columns:1.3fr .7fr .7fr .6fr;gap:7px;align-items:end;margin:8px 0}
.subject{border-top:1px solid #eee;padding-top:10px;margin-top:10px}.subject:first-of-type{border:0}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#eef4ff;color:#3538cd}
.ok{color:#027a48}.warn{color:var(--warn)}.bad{color:var(--danger)}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;z-index:4}
nav button{flex:1;background:white;color:#344054;border-radius:0;padding:12px 4px;font-size:12px}nav button.active{color:var(--navy);font-weight:800;background:#f0f4f8}
.page{display:none}.page.active{display:block}.task{padding:10px 0;border-bottom:1px solid #eee}.task:last-child{border:0}
.small{font-size:12px;color:var(--muted)} .actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 4px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}
</style>
</head>
<body>
<header><h1>감정평가사 1차 합격관리</h1><div class="sub">시험일까지 진도·시간·점수를 한 곳에서 관리</div></header>
<main>
<section id="home" class="page active">
 <div class="grid">
  <div class="card"><div class="label">시험 D-Day</div><div id="dday" class="kpi"></div></div>
  <div class="card"><div class="label">전체 학습시간 달성률</div><div id="overallRate" class="kpi">0%</div><div class="progress"><div id="overallBar" class="bar"></div></div></div>
 </div>
 <div class="card"><h2>오늘의 학습 블록</h2><div id="todayTasks"></div></div>
 <div class="card"><h2>과목별 상태</h2><div id="subjectSummary"></div></div>
</section>

<section id="progress" class="page">
 <div class="card"><h2>계획량 → 실제량 → 자동 달성률</h2>
 <div class="small">실제량만 입력하면 자동 저장·계산됩니다. 120시간 계획에 120시간이면 100%, 90시간이면 75%입니다.</div>
 <div id="progressRows"></div></div>
</section>

<section id="scores" class="page">
 <div class="card"><h2>모의고사 / 기출 점수</h2>
 <div id="scoreInputs"></div>
 <button onclick="saveScores()">점수 저장</button>
 <div style="margin-top:14px"><span class="label">5과목 평균</span><div id="avgScore" class="kpi">0</div><div id="passStatus"></div></div>
 </div>
</section>

<section id="settings" class="page">
 <div class="card"><h2>시험 설정</h2>
 <label>시험 목표일</label><input id="examDate" type="date" value="2027-04-03">
 <div style="height:10px"></div><button onclick="saveExamDate()">저장</button></div>
 <div class="card"><h2>데이터 백업</h2><div class="actions">
 <button onclick="exportData()">백업 파일 저장</button>
 <button class="secondary" onclick="document.getElementById('importFile').click()">백업 복원</button>
 <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
 </div><div class="small" style="margin-top:10px">기록은 이 기기의 브라우저 저장공간에 보관됩니다. 브라우저 데이터를 삭제하기 전에 백업하세요.</div></div>
</section>
</main>
<nav>
<button class="active" onclick="showPage('home',this)">오늘</button>
<button onclick="showPage('progress',this)">진도</button>
<button onclick="showPage('scores',this)">점수</button>
<button onclick="showPage('settings',this)">설정</button>
</nav>
<script>
const subjects=[
 {name:"회계학",plan:120,unit:"시간"},{name:"경제학",plan:120,unit:"시간"},
 {name:"민법",plan:80,unit:"시간"},{name:"관계법규",plan:80,unit:"시간"},{name:"부동산학원론",plan:80,unit:"시간"}
];
const blocks=[
 ["09:30–11:30","회계학","취약과목 우선: 심화/계산"],
 ["13:30–14:30","경제학·민법","요일별 이론요약/기출"],
 ["15:30–17:00","관계법규·부동산학원론 + 회계·경제","이론요약 + 계산/오답"],
 ["20:00–21:30","5과목","당일 복습·기출·미달 진도 보충"]
];
let data=JSON.parse(localStorage.getItem("appraiserData")||"{}");
data.examDate=data.examDate||"2027-04-03"; data.actual=data.actual||{}; data.scores=data.scores||{};
function save(){localStorage.setItem("appraiserData",JSON.stringify(data))}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function status(rate){return rate>=100?'<span class="ok">목표달성</span>':rate>=80?'<span class="warn">정상진행</span>':'<span class="bad">보정필요</span>'}
function render(){
 document.getElementById("examDate").value=data.examDate;
 const now=new Date(); now.setHours(0,0,0,0); const ex=new Date(data.examDate+"T00:00:00");
 document.getElementById("dday").textContent="D-"+Math.max(0,Math.ceil((ex-now)/86400000));
 let plan=0,actual=0;
 subjects.forEach(s=>{plan+=s.plan;actual+=Number(data.actual[s.name]||0)});
 let r=pct(actual,plan); document.getElementById("overallRate").textContent=r+"%";document.getElementById("overallBar").style.width=Math.min(r,100)+"%";
 document.getElementById("todayTasks").innerHTML=blocks.map(b=>`<div class="task"><b>${b[0]}</b> <span class="badge">${b[1]}</span><div class="small">${b[2]}</div></div>`).join("");
 document.getElementById("subjectSummary").innerHTML=subjects.map(s=>{let a=Number(data.actual[s.name]||0),r=pct(a,s.plan);return `<div class="subject"><b>${s.name}</b> · ${a}/${s.plan}${s.unit} · ${r}% ${status(r)}<div class="progress"><div class="bar" style="width:${Math.min(r,100)}%"></div></div></div>`}).join("");
 document.getElementById("progressRows").innerHTML=subjects.map(s=>{let a=data.actual[s.name]??0,r=pct(Number(a),s.plan);return `<div class="subject"><b>${s.name}</b><div class="row"><div><label>계획량</label><input value="${s.plan}" disabled></div><div><label>실제량</label><input type="number" step=".5" value="${a}" oninput="updateActual('${s.name}',this.value)"></div><div><label>단위</label><input value="${s.unit}" disabled></div><div><label>달성률</label><input value="${r}%" disabled></div></div>${status(r)}</div>`}).join("");
 document.getElementById("scoreInputs").innerHTML=subjects.map(s=>`<div class="row" style="grid-template-columns:1.5fr 1fr"><div><b>${s.name}</b></div><div><input id="score_${s.name}" type="number" min="0" max="100" value="${data.scores[s.name]??''}" placeholder="점수"></div></div>`).join("");
 calcScores();
}
function updateActual(n,v){data.actual[n]=Number(v||0);save();render()}
function saveScores(){subjects.forEach(s=>data.scores[s.name]=Number(document.getElementById("score_"+s.name).value||0));save();render()}
function calcScores(){let vals=subjects.map(s=>Number(data.scores[s.name]||0));let avg=vals.reduce((a,b)=>a+b,0)/5;document.getElementById("avgScore").textContent=avg.toFixed(1);let fail=vals.some(x=>x<40);document.getElementById("passStatus").innerHTML=(!fail&&avg>=60)?'<span class="ok"><b>합격권</b> — 평균 60점 이상·과락 없음</span>':`<span class="bad"><b>보정 필요</b> — ${fail?"40점 미만 과목 있음":"평균 60점 미만"}</span>`}
function saveExamDate(){data.examDate=document.getElementById("examDate").value;save();render()}
function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="감정평가사_합격관리_백업.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{data=JSON.parse(rd.result);save();render();alert("복원 완료")}catch{alert("백업 파일을 확인하세요")}};rd.readAsText(f)}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
render();
</script>
</body></html>
